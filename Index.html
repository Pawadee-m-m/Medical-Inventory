<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สต็อกเวชภัณฑ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f4;--surface:#fff;--ink:#17262b;--muted:#5b6b70;--line:#d9e1df;--accent:#0e7c66;--accent-ink:#fff;--warn:#b7791f;--bad:#b42318;--ok:#0e7c66}
@media (prefers-color-scheme:dark){:root{--bg:#10191b;--surface:#18252a;--ink:#e7efed;--muted:#97a8ab;--line:#2a3a3f;--accent:#3cc4a6;--accent-ink:#06201a;--warn:#e0a84a;--bad:#f0877c;--ok:#3cc4a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;background:var(--bg);padding:16px 0 0;z-index:2}
h1{font-size:20px;font-weight:700;margin:0 0 12px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{flex:1 0 auto;padding:10px 12px;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.chip{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip b{font-weight:700;margin-left:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search{margin:10px 0 4px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:8px}
.row.warn{border-left-color:var(--warn)}.row.bad{border-left-color:var(--bad)}
.row .main{flex:1;min-width:0}
.name{font-weight:500}
.sub{font-size:13px;color:var(--muted)}
.qty{text-align:right;white-space:nowrap}
.qty b{font-size:20px}
.flag{font-size:13px;font-weight:500}.flag.warn{color:var(--warn)}.flag.bad{color:var(--bad)}
.empty{padding:32px 0;text-align:center;color:var(--muted)}
form{display:grid;gap:16px;padding-top:20px}
label{display:grid;gap:6px;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:14px;color:var(--muted);margin:-8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save{padding:14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.save[disabled]{opacity:.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%}
.preview{font-size:14px;color:var(--muted);margin:-8px 0 0}.preview b{color:var(--ink)}.mini{margin-top:6px;padding:4px 10px;border:1px solid var(--bad);border-radius:6px;background:none;color:var(--bad);font:inherit;font-size:13px;cursor:pointer}
.newlot{display:grid;gap:16px;padding:12px;border:1px dashed var(--line);border-radius:8px}.check{display:flex;gap:8px;align-items:center;font-weight:400}.check input{width:auto}
.alert{margin-top:14px;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;background:var(--surface);color:var(--bad);font-weight:500;cursor:pointer}
h2{font-size:16px;margin:24px 0 0}.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin-top:8px;font-size:14px}.bar i{display:block;height:10px;background:var(--accent);border-radius:5px}.bar b{text-align:right}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>สต็อกเวชภัณฑ์</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-stock" aria-selected="true">สต็อก</button>
      <button class="tab" role="tab" id="t-dash" aria-selected="false">ภาพรวม</button>
      <button class="tab" role="tab" id="t-eval" aria-selected="false">ประเมิน</button>
      <button class="tab" role="tab" id="t-price" aria-selected="false">เปรียบเทียบราคา</button>
      <button class="tab" role="tab" id="t-form" aria-selected="false">บันทึกรายการ</button>
    </div>
  </header>

  <section id="p-stock">
    <div class="alert" id="alert" role="button" tabindex="0" hidden></div>
    <div class="chips" id="chips"></div>
    <input class="search" id="q" type="search" placeholder="ค้นหาชื่อหรือ Lot Code" aria-label="ค้นหา">
    <div id="list"><div class="empty">กำลังโหลดข้อมูล</div></div>
  </section>

  <section id="p-form" hidden>
    <form id="f">
      <div class="seg" id="seg">
        <button type="button" data-t="รับเข้า" aria-pressed="true">รับเข้า</button>
        <button type="button" data-t="เบิก" aria-pressed="false">เบิก</button>
        <button type="button" data-t="ปรับยอด" aria-pressed="false">ปรับยอด</button>
      </div>
      <p class="hint" id="hint"></p>
      <label>รายการ<select id="lot" required></select></label>
      <p class="preview" id="preview" hidden></p>
      <label class="check" id="nlcheck"><input id="isnew" type="checkbox">ล็อตใหม่หรือขนาดใหม่ที่ยังไม่มีในสต็อก</label>
      <div class="newlot" id="newlot" hidden>
        <label>Item ID<input id="nitem" list="itemids" placeholder="เช่น WND001-3"></label>
        <datalist id="itemids"></datalist>
        <label>ชื่อ<input id="nname" type="text"></label>
        <div class="two"><label>ขนาด<input id="nsize" type="text"></label><label>หน่วย<input id="nunit" type="text"></label></div>
        <label>วันหมดอายุ (เว้นว่างถ้าไม่มี)<input id="nexp" type="date"></label>
        <label>Lot Code (สร้างให้ แก้ได้)<input id="nlot" type="text"></label>
      </div>
      <div class="two">
        <label>วันที่<input id="date" type="date" required></label>
        <label id="qlabel">จำนวน<input id="qty" type="number" min="0" step="any" inputmode="decimal" required></label>
      </div>
      <label id="plabel">ราคา/หน่วย (บาท)<input id="price" type="number" min="0" step="any" inputmode="decimal"></label>
      <label>เหตุผลหรือกิจกรรม<input id="reason" type="text" placeholder="เช่น งานกีฬาสี"></label>
      <label id="blabel" hidden>ผู้ยืม<input id="borrower" type="text"></label>
      <label>หมายเหตุ<textarea id="note" rows="2"></textarea></label>
      <button class="save" id="save" type="submit">บันทึกรายการ</button>
    </form>
  </section>

  <section id="p-dash" hidden><div id="dash"></div></section>
  <section id="p-eval" hidden><div id="eval"></div></section>

  <section id="p-price" hidden>
    <p class="hint" style="margin-top:16px">เก็บราคาที่หามาเปรียบเทียบ แยกจากรายการซื้อและเงินที่ใช้จริง ไม่ถูกรวมในยอดใดๆ</p>
    <form id="qf">
      <label>ชื่อสินค้า<input id="qname" list="names" required></label>
      <datalist id="names"></datalist>
      <div class="two"><label>ขนาด<input id="qsize"></label><label>ร้าน<input id="qshop" required></label></div>
      <div class="two"><label>ราคา (บาท)<input id="qprice" type="number" min="0" step="any" inputmode="decimal" required></label><label>จำนวนที่ได้<input id="qqty" type="number" min="1" step="any" value="1"></label></div>
      <label>หมายเหตุ<input id="qnote"></label>
      <button class="save" type="submit">บันทึกราคา</button>
    </form>
    <div id="quotes"></div>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
var items = [], filter = 'all', type = 'รับเข้า';
var HINTS = {
  'รับเข้า': 'จำนวนที่ซื้อหรือรับเข้ามาเพิ่ม ไม่ใช่ยอดรวม',
  'เบิก': 'จำนวนที่เบิกออกไป ต้องใส่วันที่ด้วย ไม่งั้นยอดไม่ลด',
  'ปรับยอด': 'ยอดที่นับได้จริงตอนนี้ ไม่ใช่จำนวนที่ใช้ไป'
};
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function status(i) {
  if (i.days !== null && i.days < 0) return 'expired';
  if (i.days !== null && i.days <= 60) return 'soon';
  if (i.qty <= 0) return 'empty';
  return 'ok';
}
function gone(i) { return i.qty <= 0 && i.days !== null && i.days < 0; }
function counts() {
  var c = { all: 0, soon: 0, expired: 0, empty: 0 };
  items.forEach(function (i) {
    if (gone(i)) return;
    c.all++;
    if (i.qty <= 0) c.empty++;
    else if (i.days !== null && i.days < 0) c.expired++;
    else if (i.days !== null && i.days <= 60) c.soon++;
  });
  return c;
}
function renderChips() {
  var c = counts();
  $('alert').hidden = !c.expired;
  $('alert').textContent = 'มีของหมดอายุแล้ว ' + c.expired + ' รายการ กดเพื่อดูและทิ้งออกจากสต็อก';
  var defs = [['all','ทั้งหมด'],['soon','ใกล้หมดอายุ'],['expired','หมดอายุแล้ว'],['empty','ของหมด']];
  $('chips').innerHTML = defs.map(function (d) {
    return '<button class="chip" data-f="' + d[0] + '" aria-pressed="' + (filter === d[0]) + '">' + d[1] + '<b>' + c[d[0]] + '</b></button>';
  }).join('');
}
function renderList() {
  var q = $('q').value.trim().toLowerCase();
  var rows = items.filter(function (i) {
    if (q && (i.name + ' ' + i.lot + ' ' + i.size).toLowerCase().indexOf(q) < 0) return false;
    if (gone(i)) return false;
    if (filter === 'soon') return i.qty > 0 && i.days !== null && i.days >= 0 && i.days <= 60;
    if (filter === 'expired') return i.qty > 0 && i.days !== null && i.days < 0;
    if (filter === 'empty') return i.qty <= 0;
    return true;
  });
  if (!rows.length) { $('list').innerHTML = '<div class="empty">ไม่พบรายการ ลองเปลี่ยนตัวกรองหรือคำค้นหา</div>'; return; }
  $('list').innerHTML = rows.map(function (i) {
    var s = status(i), cls = s === 'expired' || s === 'empty' ? 'bad' : s === 'soon' ? 'warn' : '';
    var flag = '';
    if (i.days !== null && i.days < 0) flag = '<div class="flag bad">หมดอายุแล้ว ' + i.exp + '</div>' + (i.qty > 0 ? '<button class="mini" data-d="' + esc(i.lot) + '">ทิ้งของหมดอายุ</button>' : '');
    else if (i.days !== null && i.days <= 60) flag = '<div class="flag warn">อีก ' + i.days + ' วัน (' + i.exp + ')</div>';
    else if (i.exp) flag = '<div class="sub">หมดอายุ ' + i.exp + '</div>';
    return '<div class="row ' + cls + '"><div class="main"><div class="name">' + esc(i.name) + (i.size ? ' ' + esc(i.size) : '') +
      '</div><div class="sub">' + esc(i.lot) + '</div>' + flag + '</div><div class="qty"><b>' + i.qty + '</b><div class="sub">' + esc(i.unit) + '</div></div></div>';
  }).join('');
}
function renderSelect() {
  $('lot').innerHTML = '<option value="">เลือกรายการ</option>' + items.map(function (i) {
    return '<option value="' + esc(i.lot) + '">' + esc(i.name) + (i.size ? ' ' + esc(i.size) : '') + ' (' + esc(i.lot) + ')</option>';
  }).join('');
}
function load() {
  google.script.run.withSuccessHandler(function (d) {
    items = d.items; recent = d.recent; renderChips(); renderList(); renderSelect(); renderIds(); renderNames(); upd(); renderDash(); renderEval();
  }).withFailureHandler(function (e) {
    $('list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + '</div>';
  }).getData();
}
function renderIds() {
  var ids = {}; items.forEach(function (i) { ids[i.item] = 1; });
  $('itemids').innerHTML = Object.keys(ids).map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');
}
function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function cur() { return items.filter(function (i) { return i.lot === $('lot').value; })[0]; }
function upd() {
  var p = $('preview'), c = cur(), q = Number($('qty').value);
  if (!c || $('isnew').checked) { p.hidden = true; return; }
  var t = 'ตอนนี้เหลือ <b>' + c.qty + ' ' + esc(c.unit) + '</b>';
  if ($('qty').value !== '') {
    if (type === 'รับเข้า') t += ' หลังบันทึกจะเป็น <b>' + (c.qty + q) + '</b>';
    if (type === 'เบิก') t += ' หลังบันทึกจะเป็น <b>' + (c.qty - q) + '</b>';
    if (type === 'ปรับยอด') t += ' ต่างจากที่ระบบคิด <b>' + (q - c.qty) + '</b>';
  }
  p.innerHTML = t; p.hidden = false;
}
function toggleNew() {
  var n = $('isnew').checked;
  $('newlot').hidden = !n; $('lot').parentNode.hidden = n; $('lot').required = !n;
  ['nitem', 'nname', 'nlot'].forEach(function (id) { $(id).required = n; });
  upd();
}
function autoLot() {
  var it = $('nitem').value.trim(), e = $('nexp').value;
  if (it) $('nlot').value = it + (e ? '-F' + e.slice(2, 4) + e.slice(5, 7) : '-LEG');
}
var recent = [], quotes = [];
function groupItems() {
  var g = {};
  items.forEach(function (i) {
    if (gone(i)) return;
    var k = g[i.item] = g[i.item] || { name: i.name, size: i.size, unit: i.unit, cat: i.cat, min: null, usable: 0, expired: 0, soon: [] };
    if (i.min !== null) k.min = i.min;
    if (i.days !== null && i.days < 0) k.expired += i.qty; else k.usable += i.qty;
    if (i.qty > 0 && i.days !== null && i.days >= 0 && i.days <= 60) k.soon.push(i);
  });
  return Object.keys(g).map(function (k) { return g[k]; });
}
function label(g) { return esc(g.name) + (g.size ? ' ' + esc(g.size) : ''); }
function line(main, sub, right, cls) {
  return '<div class="row ' + (cls || '') + '"><div class="main"><div class="name">' + main + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>' + (right ? '<div class="qty">' + right + '</div>' : '') + '</div>';
}
function renderDash() {
  var c = counts(), g = groupItems(), cats = {};
  g.forEach(function (x) { var k = x.cat || 'ไม่ระบุหมวด'; cats[k] = (cats[k] || 0) + 1; });
  var max = Math.max.apply(null, Object.keys(cats).map(function (k) { return cats[k]; }).concat([1]));
  var h = '<h2>สถานะสต็อก</h2>' + line('สินค้าทั้งหมด', '', '<b>' + g.length + '</b>') +
    line('ใกล้หมดอายุภายใน 60 วัน', '', '<b>' + c.soon + '</b>', c.soon ? 'warn' : '') +
    line('หมดอายุแล้วและยังมีของ', '', '<b>' + c.expired + '</b>', c.expired ? 'bad' : '') +
    line('ของหมด', '', '<b>' + c.empty + '</b>', c.empty ? 'bad' : '');
  h += '<h2>จำนวนสินค้าตามหมวด</h2>' + Object.keys(cats).map(function (k) {
    return '<div class="bar"><span>' + esc(k) + '</span><i style="width:' + Math.round(cats[k] / max * 100) + '%"></i><b>' + cats[k] + '</b></div>';
  }).join('');
  h += '<h2>รายการล่าสุด</h2>' + (recent.length ? recent.map(function (r) {
    var it = items.filter(function (i) { return i.lot === r.lot; })[0];
    return line(esc(it ? it.name + (it.size ? ' ' + it.size : '') : r.lot), r.date + ' ' + esc(r.type), '<b>' + r.q + '</b>');
  }).join('') : '<div class="empty">ยังไม่มีรายการบันทึก</div>');
  $('dash').innerHTML = h;
}
function renderEval() {
  var g = groupItems(), hasMin = g.some(function (x) { return x.min !== null; });
  var buy = g.filter(function (x) { return x.min !== null ? x.usable < x.min : x.usable <= 0; });
  var h = '<h2>ควรซื้อ</h2>' + (buy.length ? buy.map(function (x) {
    var need = x.min !== null ? x.min - x.usable : null;
    return line(label(x), x.min !== null ? 'ใช้ได้ ' + x.usable + ' ต่ำกว่าขั้นต่ำ ' + x.min : 'ของหมด ยังไม่ได้ตั้งขั้นต่ำ',
      need !== null ? 'ซื้อ <b>' + need + '</b> ' + esc(x.unit) : '', 'bad');
  }).join('') : '<div class="empty">ตอนนี้ไม่มีรายการที่ต้องซื้อ</div>');
  if (!hasMin) h += '<p class="hint">เพิ่มคอลัมน์ “ควรมีขั้นต่ำ” ในชีต Stock เพื่อให้ระบบคำนวณจำนวนที่ต้องซื้อ</p>';
  var exp = g.filter(function (x) { return x.expired > 0; });
  h += '<h2>หมดอายุแล้ว ต้องทิ้ง</h2>' + (exp.length ? exp.map(function (x) {
    return line(label(x), 'ไปที่แท็บสต็อกเพื่อกดทิ้ง', '<b>' + x.expired + '</b> ' + esc(x.unit), 'bad');
  }).join('') : '<div class="empty">ไม่มี</div>');
  var soon = [];
  g.forEach(function (x) { x.soon.forEach(function (i) { soon.push(line(label(x), 'Lot ' + esc(i.lot) + ' หมดอายุ ' + i.exp + ' (อีก ' + i.days + ' วัน)', '<b>' + i.qty + '</b> ' + esc(i.unit), 'warn')); }); });
  h += '<h2>ใกล้หมดอายุ ควรใช้ให้ทัน</h2>' + (soon.length ? soon.join('') : '<div class="empty">ไม่มี</div>');
  $('eval').innerHTML = h;
}
function renderQuotes() {
  var g = {};
  quotes.forEach(function (q) { var k = q.name + (q.size ? ' ' + q.size : ''); (g[k] = g[k] || []).push(q); });
  var keys = Object.keys(g);
  if (!keys.length) { $('quotes').innerHTML = '<div class="empty">ยังไม่มีราคาที่บันทึกไว้</div>'; return; }
  $('quotes').innerHTML = keys.map(function (k) {
    var list = g[k].slice().sort(function (a, b) { return a.unit - b.unit; });
    return '<h2>' + esc(k) + '</h2>' + list.map(function (q, n) {
      return line(esc(q.shop), q.date + (q.note ? ' ' + esc(q.note) : ''), '<b>' + q.unit.toFixed(2) + '</b> บาท/หน่วย' + (n === 0 && list.length > 1 ? '<div class="flag">ถูกสุด</div>' : ''), n === 0 ? '' : 'warn');
    }).join('');
  }).join('');
}
function loadQuotes() {
  google.script.run.withSuccessHandler(function (q) { quotes = q; renderQuotes(); })
    .withFailureHandler(function (e) { $('quotes').innerHTML = '<div class="empty">โหลดราคาไม่สำเร็จ: ' + esc(e.message) + '</div>'; }).getQuotes();
}
function renderNames() {
  var n = {}; items.forEach(function (i) { n[i.name] = 1; });
  $('names').innerHTML = Object.keys(n).map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');
}
var TABS = ['stock', 'dash', 'eval', 'price', 'form'];
function tab(name) {
  TABS.forEach(function (t) { $('p-' + t).hidden = t !== name; $('t-' + t).setAttribute('aria-selected', t === name); });
}
function setType(t) {
  type = t;
  document.querySelectorAll('#seg button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.t === t); });
  $('hint').textContent = HINTS[t];
  $('plabel').hidden = t !== 'รับเข้า';
  $('blabel').hidden = t !== 'เบิก';
  $('nlcheck').hidden = t !== 'รับเข้า';
  if (t !== 'รับเข้า') { $('isnew').checked = false; toggleNew(); }
  upd();
}
function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; setTimeout(function () { t.hidden = true; }, 3000); }

TABS.forEach(function (t) { $('t-' + t).onclick = function () { tab(t); }; });
$('qf').onsubmit = function (e) {
  e.preventDefault();
  google.script.run.withSuccessHandler(function () {
    $('qprice').value = ''; $('qnote').value = ''; toast('บันทึกราคาแล้ว'); loadQuotes();
  }).withFailureHandler(function (err) { toast(err.message); })
    .addQuote({ name: $('qname').value.trim(), size: $('qsize').value.trim(), shop: $('qshop').value.trim(), price: $('qprice').value, qty: $('qqty').value, note: $('qnote').value });
};
$('chips').onclick = function (e) { var b = e.target.closest('.chip'); if (b) { filter = b.dataset.f; renderChips(); renderList(); } };
$('q').oninput = renderList;
$('seg').onclick = function (e) { var b = e.target.closest('button'); if (b) setType(b.dataset.t); };
$('alert').onclick = function () { filter = 'expired'; renderChips(); renderList(); };
$('isnew').onchange = toggleNew;
$('lot').onchange = upd; $('qty').oninput = upd;
$('nitem').oninput = autoLot; $('nexp').onchange = autoLot;
$('list').onclick = function (e) {
  var b = e.target.closest('[data-d]');
  if (!b || !confirm('ทิ้งของหมดอายุ Lot นี้ใช่ไหม ระบบจะบันทึกปรับยอดเป็น 0')) return;
  google.script.run.withSuccessHandler(function () { toast('ทิ้งของหมดอายุแล้ว'); load(); })
    .withFailureHandler(function (err) { toast(err.message); })
    .addTx({ type: 'ปรับยอด', lot: b.dataset.d, date: today(), qty: 0, price: '', reason: 'หมดอายุ ทิ้ง', borrower: '', note: '' });
};
$('f').onsubmit = function (e) {
  e.preventDefault();
  var btn = $('save'), isNew = $('isnew').checked;
  btn.disabled = true; btn.textContent = 'กำลังบันทึก';
  var p = { type: type, lot: isNew ? $('nlot').value.trim() : $('lot').value, date: $('date').value, qty: $('qty').value,
            price: $('price').value, reason: $('reason').value, borrower: $('borrower').value, note: $('note').value };
  var fail = function (err) { btn.disabled = false; btn.textContent = 'บันทึกรายการ'; toast(err.message); };
  var send = function () {
    google.script.run.withSuccessHandler(function () {
      btn.disabled = false; btn.textContent = 'บันทึกรายการ';
      $('qty').value = ''; $('price').value = ''; $('note').value = ''; $('isnew').checked = false; toggleNew();
      toast('บันทึกรายการแล้ว'); load();
    }).withFailureHandler(fail).addTx(p);
  };
  if (!isNew) return send();
  google.script.run.withSuccessHandler(send).withFailureHandler(fail)
    .addLot({ item: $('nitem').value.trim(), lot: p.lot, name: $('nname').value.trim(), size: $('nsize').value.trim(), unit: $('nunit').value.trim(), exp: $('nexp').value });
};
$('date').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
setType('รับเข้า'); load(); loadQuotes();
</script>
</body>
</html>
